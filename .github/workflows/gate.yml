# Offline correctness gate.
#
# The Lean judge is cloud-only, so this runs the Lean-free oracles: an
# independent proof kernel, finite-model checks, the banned-tactic scan, the
# golden route fixture, and the pinned judge-verified certificates. Until
# 2026-07-29 nothing enforced this outside `package_solver.ps1`, so a change
# could land unverified.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch supersedes the first; the gate takes minutes
# and nothing downstream reads an obsolete run.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 3.11 is what the submission actually runs on: the evaluation sandbox is
      # `python:3.11-slim`. This said 3.12 until 2026-08-13, so nothing in CI
      # had ever executed the solver on the interpreter that grades it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Offline correctness gate
        # Certificates carry ◇; a non-UTF-8 default encoding kills the run.
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest stage2/tests -q -n auto

      # The 500 KB cap applies to the *submission*, which is the minified
      # artifact — not `stage2/solver/solver.py`, which carries comments and
      # docstrings and has been legitimately over 500 KB since 2026-08-12. This
      # step asserted on the source until 2026-08-13 and was therefore red on
      # every push while the actual deliverable had ~11% headroom. The artifact
      # is gitignored (it is a build output), so CI has to build it to check it
      # — which also means the packaging path itself is exercised on every push.
      - name: Build the submission and check the 500 KB cap
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python stage2/solver/minify_submission.py \
            stage2/solver/solver.py /tmp/solver.py
          python - <<'PY'
          from pathlib import Path
          size = len(Path("/tmp/solver.py").read_bytes())
          limit = 500_000
          print(f"packaged submission: {size} bytes of {limit} "
                f"({limit - size} free, {100 * (limit - size) / limit:.1f}%)")
          assert size <= limit, f"submission is {size} bytes, over the {limit} limit"
          PY

      # The solver mirrors the judge's limits so it never emits a certificate
      # that will be rejected on size. Those mirrors were wrong for two weeks
      # (halved, from `judge/verify.py`'s no-config fallback instead of the
      # `judge` block the runner actually passes) and nothing detected the
      # drift. This pins the mirrors to the vendored source of truth.
      - name: Solver limits match the vendored official config
        run: |
          python - <<'PY'
          import ast, json, pathlib

          config = json.loads(
              pathlib.Path("vendor/stage2-official/pipeline/config.json").read_text())
          judge = config["judge"]

          # Read the constants without importing the solver: this check must not
          # depend on the module it is checking.
          tree = ast.parse(pathlib.Path("stage2/solver/solver.py").read_text(encoding="utf-8"))
          found = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and isinstance(node.value, ast.Constant):
                  for target in node.targets:
                      if isinstance(target, ast.Name):
                          found[target.id] = node.value.value

          expected = {
              "JUDGE_MAX_CODE_LENGTH": judge["max_code_length"],
              "JUDGE_MAX_FALSE_CERT_BYTES": judge["max_false_cert_bytes"],
          }
          problems = []
          for name, want in expected.items():
              got = found.get(name)
              if got != want:
                  problems.append(f"solver.{name} = {got!r}, config.json says {want!r}")
          if problems:
              raise SystemExit(
                  "solver judge limits drifted from vendor/stage2-official/"
                  "pipeline/config.json:\n  " + "\n  ".join(problems))
          print("solver judge limits match config.json:",
                {k: found[k] for k in expected})
          PY

      # RC-06 / TEST-3. The banned-token list is hand-copied into three files
      # and the judge scans raw certificate text - comments included - before
      # Lean ever runs. The 2026-08-21 upstream hardening added 12 tokens in one
      # commit; a repeat after the next sync would reject every certificate
      # while every offline check stayed green (rail 14).
      #
      # RC-05. The dependency policy is the one acceptance gate with no offline
      # model at all, and deliberately so: the report is over the elaborated
      # term, not the source text, so a syntactic approximation would fail
      # closed on valid certificates (rail 4). Pinning the vendored policy is
      # the safe half - an upstream change to it surfaces as a red build rather
      # than as unexplained `incomplete_proof` verdicts.
      - name: Judge banned tokens and proof policy match the vendored judge
        run: |
          python - <<'PY'
          import ast, pathlib

          def module_assign(path, name):
              tree = ast.parse(pathlib.Path(path).read_text(encoding="utf-8"))
              for node in tree.body:
                  if isinstance(node, ast.Assign) and any(
                          isinstance(t, ast.Name) and t.id == name for t in node.targets):
                      return ast.literal_eval(node.value)
              raise SystemExit(f"{name} not found in {path}")

          official = set(module_assign(
              "vendor/stage2-official/judge/verify.py", "BANNED_PROOF_TOKENS"))
          copies = {
              "stage2/solver/solver.py": "JUDGE_BANNED_TOKENS",
              "stage2/tests/oracles.py": "_JUDGE_BANNED_TOKENS",
          }
          problems = []
          for path, name in copies.items():
              mirror = set(module_assign(path, name))
              if mirror != official:
                  problems.append(
                      f"{path}:{name} missing {sorted(official - mirror)} "
                      f"extra {sorted(mirror - official)}")
          if problems:
              raise SystemExit(
                  "banned-token list drifted from vendor/stage2-official/judge/"
                  "verify.py:\n  " + "\n  ".join(problems))
          print(f"banned-token list matches in all three copies ({len(official)} tokens)")

          # The proof policy the deployed proxy passes to the judge. Recorded
          # 2026-08-27 against vendored proxy.py; if this fails, read the
          # upstream diff before touching the numbers (rail 14).
          policy = module_assign("vendor/stage2-official/pipeline/proxy.py",
                                 "DEFAULT_PROOF_POLICY")
          expected_axioms = ["Classical.choice", "Quot.sound", "propext"]
          expected_declarations = ["letFun"]
          expected_prefix_count = 59
          expected_prefix_digest = sorted([
              "And.", "Bool.", "Classical.", "Decidable.", "Eq.",
              "EquationLHS", "EquationRHS", "Goal", "Exists.", "False.",
              "Fin.", "Fintype.", "Function.", "HEq.", "Iff.", "Init.", "Int.",
              "Lean.", "List.", "Magma.", "Mathlib.", "MemoFinOp.", "Nat.",
              "Nonempty.", "Not.", "NthRewrites.", "OfNat.", "Option.", "Or.",
              "Prod.", "PUnit.", "RewriteCombinations.", "RewriteGoal.",
              "RewriteHypothesis.", "RewriteHypothesisAndGoal.",
              "SimpleRewrites.", "Std.", "Subgraph.", "Subtype.", "Sum.",
              "Trans.", "True.", "Unit.", "JudgeDecide.", "JudgeFinOp.",
              "JudgeMagma.", "inst", "of_decide_", "submission.", "congrArg",
              "congr_arg", "eq_self", "of_eq_true", "id", "eq_comm", "eq_mp",
              "eq_mpr", "rfl", "absurd",
          ])
          drift = []
          if sorted(policy["allowed_axioms"]) != expected_axioms:
              drift.append(f"allowed_axioms = {sorted(policy['allowed_axioms'])}")
          if sorted(policy["allowed_declarations"]) != expected_declarations:
              drift.append(
                  f"allowed_declarations = {sorted(policy['allowed_declarations'])}")
          prefixes = sorted(policy["allowed_declaration_prefixes"])
          if len(prefixes) != expected_prefix_count or prefixes != expected_prefix_digest:
              drift.append(
                  f"allowed_declaration_prefixes ({len(prefixes)} entries): "
                  f"removed {sorted(set(expected_prefix_digest) - set(prefixes))}, "
                  f"added {sorted(set(prefixes) - set(expected_prefix_digest))}")
          if drift:
              raise SystemExit(
                  "pipeline/proxy.py DEFAULT_PROOF_POLICY changed upstream - every "
                  "shipped certificate shape needs re-checking against it before "
                  "this pin is updated:\n  " + "\n  ".join(drift))
          print(f"proof policy unchanged: 3 axioms, 1 declaration, "
                f"{len(prefixes)} prefixes")
          PY
