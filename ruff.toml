# Lint config for the Stage 2 lab.
#
# Goal: `ruff check` should be *clean*, so that a finding means something. Before
# 2026-07-29 it reported 16 findings, most of them structurally unavoidable, which
# trained everyone to ignore the tool.

line-length = 100
target-version = "py311"

# `extend-exclude`, not `exclude`: plain `exclude` *replaces* ruff's built-in
# default set (`.git`, `__pycache__`, `.mypy_cache`, build dirs, ...) instead of
# adding to it. It did, and ruff walked into `.git/` — where a pasted playground
# error log had been saved as `.git/logs/errorsaug.py` — and reported 443
# `invalid-syntax` errors from that one file, turning the CI `Lint` step red and
# defeating this file's stated goal in the header. Found 2026-08-13.
extend-exclude = [
    ".venv",
    "stage1",              # frozen archive; do not churn it
    "vendor",              # vendored official harness, upstream-owned
    "tmp_stage2_smoke",    # scratch
]

[lint]
# E4/E7/E9 + F is the right level for this repo: it catches real bugs (undefined
# names, unused imports) without fighting the house style.
#
# `select` is **explicit on purpose**, and it spells out ruff's historical
# default rather than a tidier-looking `["E", "F"]`. Two things to know:
#
#  1. This block used to say "the default rule set (E, F)" and select nothing,
#     which made the linted rule set a property of whichever ruff
#     `requirements-dev.txt` happened to resolve. ruff 0.16 widened its defaults
#     (I, UP, B, SIM, RUF, DTZ, FURB, ...) and CI — pinned only at `ruff>=0.4` —
#     went from clean to 250+ findings across ~30 rules on a push that touched
#     none of them. Same shape as rail 3b: a limit owned outside the repo has to
#     be mirrored explicitly or an upstream default silently redefines it.
#  2. Bare `"E"` is **not** what the default was. It adds pycodestyle E1/E2/E3/E5,
#     including `E501` line-too-long, which this repo has never satisfied (651
#     findings, almost all E501 in archived theory tooling). `line-length` below
#     still feeds the formatter and any rule that reads it; it is not a lint gate.
#
# Found 2026-08-26.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # `l` reads as "line" or "left" throughout the data/theory tooling. It is a
    # readability preference, not a bug class, and renaming ~8 comprehension
    # variables across archived analysis scripts buys nothing.
    "E741",
]

[lint.per-file-ignores]
# The submission artifact is a single file with no package, so every repo-side
# tool must extend sys.path before it can `import solver`. That is inherently an
# import-not-at-top-of-file pattern and is correct here, not a smell.
"stage2/experiments/*.py" = ["E402"]
"stage2/tests/*.py" = ["E402"]
"theory/tools/*.py" = ["E402"]
